services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ironwake
      MYSQL_USER: ironwake
      MYSQL_PASSWORD: ironwake
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - ironwake_mysql:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uironwake", "-pironwake"]
      interval: 5s
      timeout: 5s
      retries: 20
  server:
    build: .
    ports:
      - "8787:8787"
    environment:
      PORT: 8787
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ironwake
      MYSQL_PASSWORD: ironwake
      MYSQL_DATABASE: ironwake
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  ironwake_mysql:
