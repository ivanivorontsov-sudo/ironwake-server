<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>IRONWAKE Hangar</title>
<style>
:root{--steel:#c2b48a;--dim:#8f8d80;--ink:#e6e1d4;--bg:#0b0c0a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Segoe UI,system-ui,sans-serif;overflow:hidden}
#hangar,#battle{position:absolute;inset:0}
#battle{display:none}
header{display:flex;justify-content:space-between;align-items:flex-end;padding:14px 16px 8px}
.kicker{letter-spacing:.22em;text-transform:uppercase;font-size:10px;color:var(--dim)}
h1{margin:2px 0 0;font-size:32px;font-weight:700}
.grid{display:flex;flex-direction:column;gap:10px;padding:8px 16px 16px;height:calc(100% - 72px);overflow:auto}
.card{background:#141612;border:1px solid #2a2c26;padding:14px;border-radius:2px}
.veh{margin:8px 0;padding:12px;border:1px solid #2f322b;cursor:pointer}
.veh.on{border-color:var(--steel);background:#1c1e18}
.veh h3{margin:0 0 4px;font-size:16px}
.veh p{margin:0;color:var(--dim);font-size:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input,select{background:#1a1c18;border:1px solid #333;color:var(--ink);padding:8px 10px;font:inherit}
.cta{width:100%;margin-top:12px;padding:16px;border:0;background:var(--steel);color:#16140e;font-weight:800;cursor:pointer;letter-spacing:.08em}
.cta:disabled{opacity:.5;cursor:wait}
canvas#view{position:absolute;inset:0;width:100%;height:100%;display:block;background:#1a2218;cursor:crosshair}
#hud{position:absolute;inset:0;pointer-events:none}
#st{position:absolute;left:12px;top:10px;font-size:13px;text-shadow:0 1px 2px #000;max-width:70%}
#ev{position:absolute;left:12px;top:48px;font-size:12px;color:#c8c4b6;text-shadow:0 1px 2px #000;line-height:1.45;max-width:42%;max-height:40%;overflow:hidden}
#hpwrap{position:absolute;left:12px;bottom:54px;width:min(42%,280px)}
#hp{height:8px;background:#2a1c18}#hp>b{display:block;height:100%;width:100%;background:#b4543c}
#modstrip{display:flex;gap:3px;margin-top:6px;flex-wrap:wrap}
#modstrip span{font-size:9px;padding:2px 4px;background:#10120fcc;border:1px solid #333}
#modstrip span.bad{border-color:#a05040;color:#d09080}
#modstrip span.mid{border-color:#a08040}
.btn{pointer-events:auto;position:absolute;border:1px solid #4a5040;background:#1c2018cc;color:var(--steel);padding:8px 12px;font-weight:700;cursor:pointer}
#back{left:12px;top:auto;bottom:12px}
#hint{position:absolute;right:12px;bottom:12px;font-size:11px;color:var(--dim);text-align:right}
.ok{color:#7aa06c}.bad{color:#c07060}
</style>
</head>
<body>
<section id="hangar">
  <header>
    <div>
      <div class="kicker" id="kick">Ангар · проверка сервера…</div>
      <h1>IRONWAKE</h1>
    </div>
    <div class="kicker" id="healthHint">/health</div>
  </header>
  <div class="grid">
    <div class="card">
      <div class="kicker">Гараж · /catalog/vehicles</div>
      <div id="list"></div>
    </div>
    <div class="card">
      <div class="kicker">Выбор</div>
      <h2 id="vtitle" style="margin:4px 0">—</h2>
      <p id="vdesc" style="color:var(--dim);font-size:14px;margin:0 0 10px">Загрузка каталога…</p>
      <div class="row">
        <label>Позывной <input id="callsign" maxlength="16" value="RAVEN"/></label>
        <label>Комната <input id="room" maxlength="16" value="public" style="width:7em"/></label>
        <label>Команда
          <select id="team">
            <option value="">авто</option>
            <option value="blue">blue</option>
            <option value="red">red</option>
          </select>
        </label>
      </div>
      <button class="cta" id="go" disabled>В БОЙ</button>
    </div>
  </div>
</section>

<section id="battle">
  <canvas id="view"></canvas>
  <div id="hud">
    <div id="st">подключение…</div>
    <div id="ev"></div>
    <div id="hpwrap">
      <div id="hp"><b id="hpbar"></b></div>
      <div id="modstrip"></div>
    </div>
    <button class="btn" id="back">АНГАР</button>
    <div id="hint">WASD · мышь прицел · ЛКМ / Space огонь<br/>сервер: input only</div>
  </div>
</section>

<script>
(function () {
  var API = (location.protocol.indexOf("http") === 0 ? location.origin : "http://biker9td.beget.tech").replace(/\/$/, "");
  var MOD_LABELS = {
    hull_f: "Лоб", hull_s: "Борт", hull_r: "Корма",
    turret: "Башня", gun: "Оруд.", engine: "Двиг.",
    ammo: "БК", track_l: "ГусЛ", track_r: "ГусП", fuel: "Топл.", optics: "Опт."
  };
  var vehicles = [];
  var selected = null;
  var myId = "u" + Math.random().toString(36).slice(2, 10);
  var roomId = "public";
  var joined = false;
  var myTeam = "blue";
  var units = [];
  var projectiles = [];
  var ended = false;
  var winner = null;
  var eventLog = [];
  var lastEventT = 0;
  var keys = Object.create(null);
  var mouse = { x: 0, y: 0, down: false };
  var fireLatch = false;
  var cam = { x: 0, z: 0, scale: 8 };
  var pollTimer = null;
  var inputTimer = null;

  var listEl = document.getElementById("list");
  var canvas = document.getElementById("view");
  var ctx = canvas.getContext("2d");

  function setKick(t, ok) {
    var el = document.getElementById("kick");
    el.textContent = t;
    el.className = "kicker " + (ok === true ? "ok" : ok === false ? "bad" : "");
  }

  function json(path, opt) {
    return fetch(API + path, opt).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok) throw new Error((j && j.error) || r.statusText);
        return j;
      });
    });
  }

  function post(path, body) {
    return json(path, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(body),
    });
  }

  function renderList() {
    listEl.innerHTML = vehicles.map(function (v) {
      var on = selected && v.id === selected.id ? " on" : "";
      return '<div class="veh' + on + '" data-id="' + v.id + '"><h3>' + v.name + '</h3><p>' +
        v.class + " · HP " + v.hp + " · " + (v.gun && v.gun.caliber ? v.gun.caliber + " мм" : "") +
        (v.starter ? " · starter" : "") + "</p></div>";
    }).join("") || "<p class='bad'>каталог пуст</p>";
    listEl.querySelectorAll(".veh").forEach(function (el) {
      el.onclick = function () {
        selected = vehicles.find(function (v) { return v.id === el.getAttribute("data-id"); });
        showSelected();
        renderList();
      };
    });
  }

  function showSelected() {
    if (!selected) return;
    document.getElementById("vtitle").textContent = selected.name;
    document.getElementById("vdesc").textContent =
      selected.class + " · броня F/S/R " +
      (selected.armor ? [selected.armor.front, selected.armor.side, selected.armor.rear].join("/") : "?") +
      " · перезарядка " + (selected.gun && selected.gun.reload) + " с";
    document.getElementById("go").disabled = false;
  }

  json("/health").then(function (j) {
    document.getElementById("healthHint").textContent = j.ok ? "db " + j.db + " · " + (j.tickHz || 20) + " Hz" : "health fail";
    setKick(j.ok ? "Ангар · сервер жив" : "Ангар · сервер недоступен", !!j.ok);
  }).catch(function (e) {
    setKick("Ангар · нет /health (" + e.message + ")", false);
  });

  json("/catalog/vehicles").then(function (j) {
    vehicles = j.vehicles || [];
    selected = vehicles.find(function (v) { return v.starter; }) || vehicles[0] || null;
    renderList();
    showSelected();
  }).catch(function (e) {
    document.getElementById("vdesc").textContent = "каталог: " + e.message;
  });

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(innerWidth * dpr);
    canvas.height = Math.floor(innerHeight * dpr);
    canvas.style.width = innerWidth + "px";
    canvas.style.height = innerHeight + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener("resize", resize);

  document.getElementById("go").onclick = function () {
    if (!selected) return;
    var btn = document.getElementById("go");
    btn.disabled = true;
    roomId = (document.getElementById("room").value || "public").slice(0, 16);
    var callsign = (document.getElementById("callsign").value || "OPERATOR").slice(0, 16);
    var team = document.getElementById("team").value || undefined;
    var body = {
      room: roomId,
      mode: "laststand",
      userId: myId,
      callsign: callsign,
      vehicleId: selected.id,
    };
    if (team) body.team = team;
    post("/room/join", body).then(function (j) {
      if (!j.ok) throw new Error(j.error || "join failed");
      joined = true;
      myTeam = j.team || "blue";
      ended = false;
      winner = null;
      eventLog = [];
      document.getElementById("hangar").style.display = "none";
      document.getElementById("battle").style.display = "block";
      resize();
      setSt(selected.name + " · " + myTeam + " · bots OK", true);
      startLoops();
    }).catch(function (e) {
      setKick("join: " + e.message, false);
      btn.disabled = false;
    });
  };

  document.getElementById("back").onclick = function () {
    stopLoops();
    joined = false;
    document.getElementById("battle").style.display = "none";
    document.getElementById("hangar").style.display = "block";
    document.getElementById("go").disabled = !selected;
  };

  function setSt(t, ok) {
    var el = document.getElementById("st");
    el.textContent = t;
    el.style.color = ok === false ? "#c07060" : "#c8c4b6";
  }

  function pushEvents(evs) {
    if (!evs || !evs.length) return;
    for (var i = 0; i < evs.length; i++) {
      var e = evs[i];
      if (!e || !e.t || e.t <= lastEventT) continue;
      lastEventT = e.t;
      var line = formatEvent(e);
      if (line) {
        eventLog.unshift(line);
        if (eventLog.length > 12) eventLog.length = 12;
      }
    }
    document.getElementById("ev").innerHTML = eventLog.map(function (l) {
      return "<div>" + l + "</div>";
    }).join("");
  }

  function formatEvent(e) {
    var p = e.payload || {};
    switch (e.type) {
      case "hit":
        return (p.bounce ? "рикошет" : "попадание") + " · " + (p.module || "?") + " · hp " + Math.round(p.hp || 0);
      case "shot": return "выстрел · " + shortId(p.id);
      case "fire_start": return "пожар · " + shortId(p.id);
      case "fire_end": return "пожар потух · " + shortId(p.id);
      case "cookoff": return "детонация БК · " + shortId(p.id);
      case "kill": return "уничтожен · " + shortId(p.id) + " ← " + shortId(p.by);
      case "module_break": return "модуль · " + p.module + " · " + shortId(p.id);
      case "end": return "конец · победа " + (p.winner || "—");
      case "join": return "вход · " + (p.callsign || shortId(p.id)) + (p.bot ? " [BOT]" : "");
      case "spectator": return "spectator · " + shortId(p.id);
      default: return e.type;
    }
  }

  function shortId(id) {
    if (!id) return "?";
    return String(id).length > 10 ? String(id).slice(0, 8) : String(id);
  }

  function startLoops() {
    stopLoops();
    pollTimer = setInterval(pollState, 100);
    inputTimer = setInterval(sendInput, 50);
    pollState();
  }

  function stopLoops() {
    if (pollTimer) clearInterval(pollTimer);
    if (inputTimer) clearInterval(inputTimer);
    pollTimer = inputTimer = null;
  }

  function pollState() {
    if (!joined) return;
    json("/room/state?room=" + encodeURIComponent(roomId)).then(function (j) {
      var payload = j.payload || {};
      units = payload.units || [];
      projectiles = payload.projectiles || [];
      ended = !!(payload.ended || j.ended);
      winner = payload.winner != null ? payload.winner : j.winner;
      pushEvents(j.events);
      var me = units.find(function (u) { return u.id === myId; });
      if (me) {
        cam.x = me.x;
        cam.z = me.z;
        updateHud(me);
        if (!me.alive) setSt("уничтожен · spectator · без возрождения", false);
        else if (ended) setSt("бой окончен · победа " + (winner || "—"), true);
        else setSt(me.callsign + " · " + me.team + " · HP " + me.hp + "/" + me.maxHp + " · юнитов " + units.length, true);
      }
    }).catch(function (e) {
      setSt("state: " + e.message, false);
    });
  }

  function updateHud(me) {
    var pct = me.maxHp ? Math.max(0, Math.min(100, (me.hp / me.maxHp) * 100)) : 0;
    document.getElementById("hpbar").style.width = pct + "%";
    var mods = me.modules || {};
    var html = Object.keys(MOD_LABELS).map(function (k) {
      var v = mods[k];
      if (v == null) return "";
      var cls = v <= 0.15 ? " bad" : v < 0.55 ? " mid" : "";
      return "<span class='" + cls + "'>" + MOD_LABELS[k] + " " + Math.round(v * 100) + "</span>";
    }).join("");
    document.getElementById("modstrip").innerHTML = html;
  }

  function worldAimFromMouse(me) {
    var w = innerWidth, h = innerHeight;
    var wx = cam.x + (mouse.x - w / 2) / cam.scale;
    var wz = cam.z + (mouse.y - h / 2) / cam.scale;
    return Math.atan2(wx - me.x, wz - me.z);
  }

  function sendInput() {
    if (!joined || ended) return;
    var me = units.find(function (u) { return u.id === myId; });
    if (!me || !me.alive) return;

    var throttle = 0, steer = 0;
    if (keys["KeyW"] || keys["ArrowUp"]) throttle += 1;
    if (keys["KeyS"] || keys["ArrowDown"]) throttle -= 1;
    if (keys["KeyA"] || keys["ArrowLeft"]) steer -= 1;
    if (keys["KeyD"] || keys["ArrowRight"]) steer += 1;

    var worldAim = worldAimFromMouse(me);
    var aimYaw = worldAim - me.yaw; // relative turret intent
    while (aimYaw > Math.PI) aimYaw -= Math.PI * 2;
    while (aimYaw < -Math.PI) aimYaw += Math.PI * 2;

    var wantFire = fireLatch || mouse.down || keys["Space"];
    fireLatch = false;

    post("/room/input", {
      room: roomId,
      mode: "laststand",
      userId: myId,
      throttle: throttle,
      steer: steer,
      fire: !!wantFire,
      aimYaw: aimYaw,
      aimPitch: 0,
    }).catch(function () {});
  }

  addEventListener("keydown", function (e) {
    keys[e.code] = true;
    if (e.code === "Space") {
      e.preventDefault();
      fireLatch = true;
    }
  });
  addEventListener("keyup", function (e) { keys[e.code] = false; });
  canvas.addEventListener("mousemove", function (e) {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  canvas.addEventListener("mousedown", function (e) {
    if (e.button === 0) { mouse.down = true; fireLatch = true; }
  });
  addEventListener("mouseup", function () { mouse.down = false; });

  function draw() {
    requestAnimationFrame(draw);
    if (document.getElementById("battle").style.display === "none") return;
    var w = innerWidth, h = innerHeight;
    ctx.clearRect(0, 0, w, h);

    // ground grid
    ctx.save();
    ctx.translate(w / 2, h / 2);
    ctx.scale(cam.scale, cam.scale);
    ctx.translate(-cam.x, -cam.z);

    ctx.fillStyle = "#243022";
    ctx.fillRect(cam.x - w / cam.scale, cam.z - h / cam.scale, (w * 2) / cam.scale, (h * 2) / cam.scale);

    ctx.strokeStyle = "rgba(80,90,70,0.35)";
    ctx.lineWidth = 1 / cam.scale;
    var g0 = Math.floor((cam.x - 40) / 10) * 10;
    var g1 = Math.ceil((cam.x + 40) / 10) * 10;
    for (var gx = g0; gx <= g1; gx += 10) {
      ctx.beginPath(); ctx.moveTo(gx, cam.z - 40); ctx.lineTo(gx, cam.z + 40); ctx.stroke();
    }
    for (var gz = Math.floor((cam.z - 40) / 10) * 10; gz <= Math.ceil((cam.z + 40) / 10) * 10; gz += 10) {
      ctx.beginPath(); ctx.moveTo(cam.x - 40, gz); ctx.lineTo(cam.x + 40, gz); ctx.stroke();
    }

    // projectiles
    for (var i = 0; i < projectiles.length; i++) {
      var pr = projectiles[i];
      ctx.fillStyle = "#f0e0a0";
      ctx.beginPath();
      ctx.arc(pr.x, pr.z, 0.35, 0, Math.PI * 2);
      ctx.fill();
    }

    // units — top-down boxes with simple “height” shade
    for (var j = 0; j < units.length; j++) {
      drawUnit(units[j]);
    }

    ctx.restore();

    // aim reticle in screen space
    ctx.strokeStyle = "rgba(230,225,212,0.55)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(mouse.x - 8, mouse.y); ctx.lineTo(mouse.x + 8, mouse.y);
    ctx.moveTo(mouse.x, mouse.y - 8); ctx.lineTo(mouse.x, mouse.y + 8);
    ctx.stroke();
  }

  function drawUnit(u) {
    var alive = u.alive !== false;
    var mine = u.id === myId;
    var bot = !!u.bot || (u.callsign && String(u.callsign).indexOf("BOT-") === 0);
    var col = !alive ? "#444" : mine ? "#c2b48a" : u.team === "blue" ? "#5a7a58" : "#8a5040";
    if (bot && !mine) col = u.team === "blue" ? "#6a8a9a" : "#9a6a50";

    ctx.save();
    ctx.translate(u.x, u.z);
    ctx.rotate(u.yaw || 0);

    // shadow / box body
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.fillRect(-1.1, -2.0, 2.2, 4.2);
    ctx.fillStyle = col;
    ctx.fillRect(-1.0, -1.9, 2.0, 3.8);
    // turret
    ctx.save();
    ctx.rotate(u.turretYaw || 0);
    ctx.fillStyle = mine ? "#ddd2b0" : "#2a2c28";
    ctx.fillRect(-0.7, -0.8, 1.4, 1.6);
    ctx.fillStyle = "#1a1a1a";
    ctx.fillRect(-0.12, 0.2, 0.24, 2.6);
    ctx.restore();

    // fire marker
    if (u.onFire) {
      ctx.fillStyle = "#e08030";
      ctx.beginPath();
      ctx.arc(0, 0, 1.2 + Math.random() * 0.3, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();

    // label in world xz (no rotate)
    ctx.save();
    ctx.translate(u.x, u.z);
    ctx.fillStyle = alive ? "#e8e4d8" : "#888";
    ctx.font = (11 / cam.scale) + "px sans-serif";
    ctx.textAlign = "center";
    var label = (u.callsign || shortId(u.id)) + (bot ? " ·BOT" : "");
    ctx.fillText(label, 0, -2.6);
    // hp bar
    if (alive && u.maxHp) {
      var wbar = 2.4, hbar = 0.25;
      ctx.fillStyle = "#2a1c18";
      ctx.fillRect(-wbar / 2, -2.35, wbar, hbar);
      ctx.fillStyle = "#b4543c";
      ctx.fillRect(-wbar / 2, -2.35, wbar * Math.max(0, Math.min(1, u.hp / u.maxHp)), hbar);
    }
    ctx.restore();
  }

  draw();
})();
</script>
</body>
</html>
